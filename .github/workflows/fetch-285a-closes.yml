name: Fetch 285A daily closes

on:
  # Initial workflow creation triggers a run, and can be rerun from Actions.
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-285a-closes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Fetch IPO-to-date daily closes
        run: python scripts/fetch_285a_closes.py
      - name: Commit actual downloaded JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/285A_daily_close.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update Kioxia 285A daily closes"
            git push
          fi
